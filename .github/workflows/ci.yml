name: ci

# TS-2 (#15): build + test matrix over the npm targets, on every PR and push to
# main. npm targets (release spec): macOS arm64 + x64, Linux x64 + arm64
# (glibc), Windows x64, on Node 20 and the current LTS (22).
#
# CORE PIN (G8): TS-1 (#14) replaced the sibling path dep with a pinned git
# dep — Cargo.toml builds the core through
#   trueseal-sync = { git = "...", rev = "<full SHA>" }
# and core-rev.txt records the same SHA for humans and for the SDK repos'
# mirror tooling. The pin-guard step below fails the build if the two drift.
#
# TS-1 install check: every matrix leg ends with scripts/verify-install.mjs —
# pack main + host platform package, install both into a fresh project
# (--no-optional: registry resolution of the scoped optional dependency is
# paused on the npm org, maintainer item A1), load via require AND import,
# probe the canonical statics, and tsc-type-check a consumer snippet.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    # TS-4 follow-through: fail on high-severity advisories in the npm tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  pin-guard:
    # The Cargo.toml git rev MUST equal core-rev.txt (G8 single source).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.toml rev matches core-rev.txt
        shell: bash
        run: |
          expected=$(tr -d '[:space:]' < core-rev.txt)
          test -n "$expected" || { echo "core-rev.txt is empty or missing" >&2; exit 1; }
          actual=$(grep -oP 'trueseal-sync = \{ git = "[^"]+", rev = "\K[0-9a-f]{40}' Cargo.toml || true)
          [ "$actual" = "$expected" ] || {
            echo "core pin drift: Cargo.toml rev '$actual' != core-rev.txt '$expected'" >&2
            exit 1
          }
          echo "core pin verified: $actual"
      - name: No sibling path dependency remains
        shell: bash
        run: |
          if grep -n 'trueseal-sync = { path' Cargo.toml; then
            echo "sibling path dependency is back — G8 forbids it" >&2
            exit 1
          fi

      # SDK-4 (#12): G8 forbids floating inputs anywhere — floating release
      # URLs, branch/tag refs on the core dep (rev = only), floating image
      # tags. The patterns are built by concatenation so this guard's own
      # file never matches them (a guard that greps for a literal it itself
      # contains fails on every run).
      - name: No floating cross-repo refs anywhere
        shell: bash
        run: |
          FLOAT_URL='releases/''latest'
          FLOAT_TAG=':''latest'
          if grep -rn "$FLOAT_URL" .github scripts; then
            echo "floating release URL — G8 requires an exact version + checksum" >&2
            exit 1
          fi
          if grep -nP 'trueseal-sync = \{ git = [^}]*\b(branch|tag) =' Cargo.toml; then
            echo "the core dep floats on a branch/tag — G8 requires rev = <full SHA>" >&2
            exit 1
          fi
          if grep -rn "$FLOAT_TAG" .github/workflows; then
            echo "floating image tag — G8 requires exact pins" >&2
            exit 1
          fi

      # SDK-3 (#11): version/limit values are generated from the core — a
      # hand-written literal in SDK sources is a drift bug. Negative-tested
      # in __tests__/generated-info.test.mjs.
      - name: No hand-written version or limit literals
        run: node scripts/check-no-literal-limits.mjs

  parity:
    # SDK-4 (#12): the G12 parity gate — the compiled runtime vocabularies
    # vs the SHA-256-pinned vendored Shared Facts (scripts/check-parity.mjs).
    # Runs on every PR; the report artifact is Release Evidence for the
    # Conductor. The self-test is the negative control the issue requires:
    # renamed / missing / extra case mutations must all flip the verdict.
    needs: pin-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build (parity checks the compiled output)
        run: npm ci && npm run build

      - name: G12 parity check
        run: |
          node scripts/check-parity.mjs --report trueseal-g12-parity-report.json
          node scripts/check-parity.mjs --self-test

      - name: Upload the G12 parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trueseal-g12-parity-report
          path: trueseal-g12-parity-report.json
          # A missing report on an otherwise-green run is itself a failure.
          if-no-files-found: error

  build-test:
    needs: pin-guard
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-latest, windows-latest]
        node: [20, 22]
        # macos-14 = arm64, macos-15-intel = x64. The fifth npm target
        # (linux-arm64) is the cross-compile leg below. macos-15-intel
        # replaced macos-13: the macos-13 legs sat queued for over an hour
        # across three runs without ever starting (hosted-runner capacity),
        # while macos-15-intel schedules promptly.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Build (napi native module + TypeScript)
        run: npm ci && npm run build

      - name: Test
        shell: bash
        env:
          # SDK-2 (#10): the vectors test writes the machine-readable G5
          # report the Release Conductor attaches as Release Evidence.
          TRUSEAL_VECTOR_REPORT: g5-vector-report-${{ matrix.os }}-node${{ matrix.node }}.json
        run: npm test 2>&1 | tee test-output.txt

      - name: Report skipped tests
        if: always()
        run: node scripts/report-skips.mjs test-output.txt

      - name: Upload the G5 vector report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-vector-report-${{ matrix.os }}-node${{ matrix.node }}
          path: g5-vector-report-${{ matrix.os }}-node${{ matrix.node }}.json
          # A missing report on an otherwise-green run is itself a failure:
          # the Conductor consumes one artifact per platform binary.
          if-no-files-found: error

      - name: Verify install (pack + fresh-project require/import/tsc)
        run: node scripts/verify-install.mjs

  build-linux-arm64:
    needs: pin-guard
    # Cross-compile leg for the fifth npm target. Build-only: an x64 runner
    # can't execute the arm64 .node without emulation, and runtime coverage on
    # linux-arm64 belongs to trueseal-e2e's harness (per the issue: leave
    # relay-backed flows to e2e). This leg proves the target COMPILES on every
    # PR, which is the failure class (linker/toolchain breakage) that would
    # otherwise surface only at release packaging time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install the aarch64 cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cross-build the arm64 native module
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: npm ci --ignore-scripts && npx napi build --target aarch64-unknown-linux-gnu --release
