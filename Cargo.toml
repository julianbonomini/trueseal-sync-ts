[package]
name = "trueseal-sync-ts"
version = "0.1.0"
edition = "2021"
description = "Node.js / Electron bindings for trueseal-sync"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "async"] }
napi-derive = "2"
trueseal-sync = { path = "../trueseal-sync" }
base64 = "0.22"

[build-dependencies]
napi-build = "2"

# ── trueseal-sync (sibling checkout) ────────────────────────────────────────────
# Switch to a git dep when both repos are public:
#   trueseal-sync = { git = "https://github.com/julianbonomini/trueseal-sync" }
[dev-dependencies]
