[package]
name = "trueseal-sync-ts"
version = "0.6.0"
edition = "2021"
description = "Node.js / Electron bindings for trueseal-sync"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4", "async", "compat-mode"] }
napi-derive = "3"
# TS-1 (#14): the core is a pinned GIT dependency (G8 — no sibling path, no
# floating ref). The rev MUST match core-rev.txt; CI's pin guard enforces it.
trueseal-sync = { git = "https://github.com/julianbonomini/trueseal-sync", rev = "e9f08feefd2a893cf6b53f5364c20d9e94a64e6a" }
async-trait = "0.1"
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
